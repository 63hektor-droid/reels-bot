name: post

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}

      - name: Save posted list
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json || true
          git commit -m "update posted" || true
          git push || true
