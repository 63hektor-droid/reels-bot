name: post

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo apt-get install -y fonts-vazirmatn || true

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MIN_VIEWS: "10000"
          MIN_RATIO: "0"
          MAX_AGE_DAYS: "14"
        run: |
          set -o pipefail
          python -u bot.py 2>&1 | tee log.txt

      - name: Save posted list
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add log.txt || true
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "update posted list" && git push)
